[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "triagetier"
version = "0.1.0"
description = "Zero-shot agentic vision-language pipeline for multi-organ trauma triage"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["trauma triage", "vision-language model", "zero-shot", "agentic", "emergency radiology"]

dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11,<1.16",
    "scikit-learn>=1.3,<1.7",
    "omegaconf>=2.3,<2.4",
    "pillow>=10.0,<12.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1,<2.5",
    "transformers>=4.49,<4.52",
    "accelerate>=0.30",
    "autoawq>=0.2.5",
    "qwen-vl-utils>=0.0.8",
    "einops>=0.8",
]
imaging = [
    "pydicom>=2.4",
    "nibabel>=5.2",
    "SimpleITK>=2.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
triagetier = "triagetier.toolchain.run:main"

[tool.hatch.build.targets.wheel]
packages = ["triagetier"]

[tool.hatch.build.targets.wheel.force-include]
"triagetier/lexicon/assets" = "triagetier/lexicon/assets"

[tool.black]
line-length = 96
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 96
known_first_party = ["triagetier"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["triagetier"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
files = ["triagetier"]

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "torch.*",
    "torchvision.*",
    "awq.*",
    "qwen_vl_utils.*",
    "pydicom.*",
    "nibabel.*",
    "SimpleITK.*",
    "sklearn.*",
    "scipy.*",
    "PIL.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
